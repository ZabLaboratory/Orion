# golangci-lint configuration. Stays minimal: enable the linters that
# catch real bugs, skip the stylistic ones we'd argue about.

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gocritic
    - revive
    - bodyclose
    - copyloopvar

  settings:
    revive:
      rules:
        - name: unused-parameter
          disabled: true   # noisy on interface implementations
    gocritic:
      disabled-checks:
        - hugeParam       # event payloads are intentionally pass-by-value
        - paramTypeCombine

issues:
  exclusions:
    paths:
      - tests/e2e
