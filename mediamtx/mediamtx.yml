# MediaMTX configuration — Orion broadcast relay.
#
# MediaMTX receives WHIP from browsers on :8889 and forwards to Twitch via an
# ffmpeg process spawned through `runOnReady` — see
# src/orion/services/mediamtx.py::build_twitch_relay_config.
#
# Paths are created dynamically by Orion; this config only sets the global
# defaults and enables the protocol endpoints.

logLevel: info
logDestinations: [stdout]

# --- Control API (consumed by Orion) --------------------------------------
api: yes
apiAddress: :9997
apiEncryption: no
apiAllowOrigin: '*'

# --- External authentication ---------------------------------------------
# Orion validates the ingress token that the browser appends as
#   ?token=<ingress_token>
# to the WHIP URL. We only gate publish — read paths stay permissive to keep
# the HLS preview (and debug via the control API) usable.
authMethod: http
authHTTPAddress: http://orion-api:4007/mediamtx/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

# --- Protocol endpoints ---------------------------------------------------
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]
rtspAuthMethods: [basic]
rtspEncryption: "no"

rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"

hls: yes
hlsAddress: :8888
hlsEncryption: no

webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
# Allow browsers on localhost/in-cluster — tighten in prod.
webrtcAllowOrigin: '*'
webrtcTrustedProxies: []
# ICE — loosen in dev, pin in prod.
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
# Browser-addressable host — MediaMTX uses this to advertise its local ICE candidates.
# In dev this resolves to the container. In prod, set to the public hostname of the
# MediaMTX container (usually behind Caddy with stream: true).
# webrtcAdditionalHosts:
#   - orion-media.cyell.dev

srt: no

# --- Path defaults --------------------------------------------------------
# Paths are created dynamically by Orion through the control API. `all_others`
# is left undefined so publishing to an unknown path is rejected — only the
# paths Orion explicitly provisions can ingest media.
pathDefaults:
  source: publisher
  sourceOnDemand: no
  maxReaders: 0
  # Disable recording — we're a relay, not a VOD provider (for now).
  record: no

paths:
  # Orion injects paths via POST /v3/config/paths/add/<name>.
  # Keeping this section empty means unauthorized publishes are 404'd.
