name: Deploy Solar bundle

# Repeatable, version-parameterized deploy of a Solar bundle onto the VPS
# under ORION_SOLAR_ROOT/<version>/, served by Orion's static handler at
# /static/solar/<version>/* (ZabGate strips the /orion prefix).
#
# Why this lives in Orion (not Pulsar): Orion *owns* ORION_SOLAR_ROOT, the
# `./solar` host directory mounted read-only into the orion container
# (docker-compose.prod.yml), and the static file server (internal/api/static.go).
# Pulsar/browser hosts merely *consume* the served bundle by URL. The
# operational handle for "which Solar version is installed on the box" is
# therefore an Orion concern. ADR 007 §C.2 / ADR 004 §12 criterion 12.
#
# This is a STANDALONE, on-demand deploy — distinct from the code deploy in
# ci.yml (which redeploys the Orion binary on every push to main and installs
# a hardcoded SOLAR_VERSIONS pin). Use this workflow to roll a NEW Solar
# release onto the box without a code push, by passing its version tag.
#
# Idempotent: a version already installed (marked by .installed) is skipped.
# The bundle dir is content-immutable (the version is in the URL path), so a
# re-run for an installed version is a safe no-op.

on:
  workflow_dispatch:
    inputs:
      solar_version:
        description: "Solar release tag to deploy (e.g. v0.2.0). Must match a published ZabLaboratory/Solar release with a solar-<tag>.tgz asset."
        required: true
        type: string
      force_reinstall:
        description: "Re-extract even if already installed (clears the .installed marker first). Use only to repair a corrupt install."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Serialize against the code deploy and against itself: never mutate the
# VPS solar dir concurrently with ci.yml's deploy job or another Solar deploy.
concurrency:
  group: deploy-orion
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (inputs + secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate version format
        env:
          V: ${{ inputs.solar_version }}
        run: |
          if ! printf '%s' "$V" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::solar_version '$V' must be a semver tag like v0.2.0"
            exit 1
          fi

      - name: Verify deploy secrets present
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USERNAME }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ] || [ -z "${{ secrets.VPS_APP_PATH }}" ]; then
            echo "::error::Missing required secrets (VPS_HOST, VPS_USERNAME, VPS_SSH_KEY, VPS_APP_PATH)"
            exit 1
          fi

      - name: Verify Solar release asset exists
        env:
          V: ${{ inputs.solar_version }}
        run: |
          # ZabLaboratory/Solar is PUBLIC: its release assets are anonymously
          # downloadable over HTTPS. A missing asset 404s here, failing fast
          # before we touch the VPS.
          URL="https://github.com/ZabLaboratory/Solar/releases/download/${V}/solar-${V}.tgz"
          CODE="$(curl -sSL -o /dev/null -w '%{http_code}' -I "$URL")"
          if [ "$CODE" != "200" ]; then
            echo "::error::Solar asset not reachable ($CODE): $URL"
            exit 1
          fi
          echo "Asset reachable: $URL"

  deploy:
    name: Deploy Solar bundle to VPS
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Install Solar bundle on VPS (idempotent)
        env:
          SSH_CMD: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}
          APP_PATH: ${{ secrets.VPS_APP_PATH }}
          V: ${{ inputs.solar_version }}
          FORCE: ${{ inputs.force_reinstall }}
        run: |
          # Same safe interpolation pattern as ci.yml's deploy: single-quoted
          # values baked into a remote shell preamble, read as plain vars on
          # the remote side (never passed as positional args through ssh argv).
          $SSH_CMD "APP_PATH='$APP_PATH' V='$V' FORCE='$FORCE' bash -s" << 'INSTALL_SCRIPT'
          set -euo pipefail
          target="$APP_PATH/solar/$V"
          mkdir -p "$target"

          if [ "$FORCE" = "true" ]; then
            echo "→ force_reinstall: clearing existing install of $V"
            rm -f "$target/.installed"
          fi

          if [ -f "$target/.installed" ]; then
            echo "✓ Solar $V already installed at $target — no-op"
            ls -la "$target/" | head -8
            exit 0
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          # -f → fail on HTTP >=400; --retry 3 for transient blips. A failed
          # download leaves the dir unmarked so the next run retries.
          curl -fsSL --retry 3 -o "$tmp/solar-$V.tgz" \
            "https://github.com/ZabLaboratory/Solar/releases/download/$V/solar-$V.tgz"

          # Extract into a staging dir first, then atomically swap, so a
          # partial extract never leaves a half-populated served directory.
          stage="$(mktemp -d)"
          tar -xzf "$tmp/solar-$V.tgz" -C "$stage"
          # The Solar tarball packs dist/ flat (./index.html, ./*.js …).
          if [ ! -f "$stage/index.html" ]; then
            echo "::error::Solar $V tarball has no index.html at root — refusing to install"
            exit 1
          fi
          # Replace contents of target with staged contents (keep the dir
          # itself, which is the bind-mount path Orion serves from).
          find "$target" -mindepth 1 ! -name '.installed' -exec rm -rf {} + 2>/dev/null || true
          cp -a "$stage/." "$target/"
          rm -rf "$stage"

          # Marker LAST = success signal (idempotency contract).
          touch "$target/.installed"
          echo "✓ installed Solar $V at $target"
          ls -la "$target/" | head -10
          INSTALL_SCRIPT

      - name: Health-check served bundle via gateway
        env:
          SSH_CMD: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}
          V: ${{ inputs.solar_version }}
        run: |
          # Gateway-first probe: validates Caddy + DNS + TLS + Orion static
          # handler, not just the filesystem. Orion's http.FileServer 301-
          # redirects /index.html → ./ then serves the directory index, so we
          # follow redirects (-L) and assert a final 200.
          URL="https://zabgate.cyell.dev/orion/static/solar/${V}/index.html"
          CODE="$($SSH_CMD "curl -fsSL --max-time 8 -o /dev/null -w '%{http_code}' '$URL'")" || true
          echo "GET $URL -> $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Solar $V not served via gateway (got $CODE, want 200)"
            exit 1
          fi
          echo "✓ Solar $V served at $URL"
