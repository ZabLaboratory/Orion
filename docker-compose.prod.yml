# Production compose for Orion v2 on the VPS.
# Mirrors ZabAuth's prod layout: zab-internal as the shared backend
# network, no host ports exposed (only ZabGate is publicly reachable).
# Resource limits per docs/rules/security.md and agents/_shared/deploy.md § 10.

services:
  orion:
    build:
      context: .
      # Feed the OCI image labels (org.opencontainers.image.revision /
      # .source, declared in the Dockerfile) so built images are traceable
      # to a commit instead of carrying the `unknown` defaults. The deploy
      # workflow exports ORION_GIT_REVISION / ORION_GIT_SOURCE before
      # `docker compose build`; absent those env vars (e.g. a manual local
      # build) the Dockerfile ARG defaults still apply.
      args:
        ORION_GIT_REVISION: ${ORION_GIT_REVISION:-unknown}
        ORION_GIT_SOURCE: ${ORION_GIT_SOURCE:-https://github.com/ZabLaboratory/Orion}
    container_name: orion
    restart: unless-stopped
    env_file: .env
    expose:
      - "4007"
      - "4017"
    depends_on:
      orion-db:
        condition: service_healthy
    # Liveness probe. The runtime image is distroless/static:nonroot — no
    # shell, no curl/wget — so the probe self-execs the dedicated static
    # /healthcheck binary (cmd/healthcheck), which GETs the bare `/health`
    # liveness route on the public listener (ORION_LISTEN_ADDR, :4007 by
    # default; see internal/api/public.go + internal/config/config.go) and
    # exits non-zero on anything but HTTP 200.
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 30s
      timeout: 5s
      # Orion applies goose migrations at boot before the public listener is
      # ready; 10s could flag a healthy-but-still-migrating container as
      # unhealthy on a cold start (and trip restart loops). 30s gives boot +
      # migration headroom without delaying detection of a genuinely dead
      # container, since failures during start_period don't count toward retries.
      start_period: 30s
      retries: 3
    # Solar bundles unpacked on the VPS by the deploy workflow are
    # mounted read-only into the container so Orion's static handler
    # at /static/solar/v{N.N.N}/* can serve them without re-baking
    # the image on every Solar release. The host directory is
    # populated per-version (./solar/v0.1.1/, ./solar/v0.1.2/, ...).
    volumes:
      - ./solar:/var/lib/orion/solar:ro
    deploy:
      resources:
        limits:
          memory: 512M
          # CPU isolation (ADR 003 §3.1.6/§5 — R7/B7). Time-slicing protects
          # the scene *loop*, not the host: a validated-then-pathological scene
          # can still burn CPU. Doctrine forbids killing/amputating the scene,
          # so the machine is protected by OS-level isolation instead — a
          # runaway scene saturates *this* cgroup, degrading its own scene,
          # never the show or co-tenant services on the shared VPS.
          #
          # docker compose (Compose Spec, not Swarm) honours
          # deploy.resources.limits.cpus on `up` by translating it to the
          # container's CPU quota (cgroup cpu.max). 1.0 = at most one full core.
          #
          # Sizing rationale: the VPS is a shared multi-service OVH host (G2 +
          # Zab stacks on one box). 1.0 core is far above Orion's normal/idle
          # footprint (exec is dormant in prod per R9 — near-zero CPU at boot,
          # migrations + listener only), so it does NOT throttle boot, health,
          # migrations, or normal serving. Yet it caps a single runaway scene
          # at one core, leaving the rest of the host for ZabGate + the show
          # even on the smallest plausible 2-vCPU tier. Recalibrate once the
          # live core count is confirmed (`nproc` on the VPS) — see runbook
          # docs/runbooks/orion-cpu-pathological-scene.md §Sizing.
          cpus: "1.0"
        reservations:
          memory: 128M
    networks:
      zab-internal:
        aliases:
          - orion
          - orion-api

  orion-db:
    image: postgres:16-alpine
    container_name: orion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ORION_PG_USER:-orion}
      POSTGRES_PASSWORD: ${ORION_PG_PASSWORD}
      POSTGRES_DB: ${ORION_PG_DB:-orion}
    volumes:
      - orion_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      zab-internal:
        aliases:
          - orion-postgres
          - orion-db

volumes:
  orion_pg_data:
    name: orion_pg_data

networks:
  zab-internal:
    external: true
