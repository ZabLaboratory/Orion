# Production compose for Orion v2 on the VPS.
# Mirrors ZabAuth's prod layout: zab-internal as the shared backend
# network, no host ports exposed (only ZabGate is publicly reachable).
# Resource limits per docs/rules/security.md and agents/_shared/deploy.md § 10.

services:
  orion:
    build:
      context: .
      secrets:
        - blue_read_token
      # Feed the OCI image labels (org.opencontainers.image.revision /
      # .source, declared in the Dockerfile) so built images are traceable
      # to a commit instead of carrying the `unknown` defaults. The deploy
      # workflow exports ORION_GIT_REVISION / ORION_GIT_SOURCE before
      # `docker compose build`; absent those env vars (e.g. a manual local
      # build) the Dockerfile ARG defaults still apply.
      args:
        ORION_GIT_REVISION: ${ORION_GIT_REVISION:-unknown}
        ORION_GIT_SOURCE: ${ORION_GIT_SOURCE:-https://github.com/ZabLaboratory/Orion}
        ORION_GO_VERSION: ${ORION_GO_VERSION:-unknown}
    container_name: orion
    restart: unless-stopped
    env_file: .env
    expose:
      - "4007"
      - "4017"
    depends_on:
      orion-db:
        condition: service_healthy
      orion-workload-identity-agent:
        condition: service_started
    # Liveness probe. The runtime image is distroless/static:nonroot — no
    # shell, no curl/wget — so the probe self-execs the dedicated static
    # /healthcheck binary (cmd/healthcheck), which GETs the bare `/health`
    # liveness route on the public listener (ORION_LISTEN_ADDR, :4007 by
    # default; see internal/api/public.go + internal/config/config.go) and
    # exits non-zero on anything but HTTP 200.
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 30s
      timeout: 5s
      # Orion applies goose migrations at boot before the public listener is
      # ready; 10s could flag a healthy-but-still-migrating container as
      # unhealthy on a cold start (and trip restart loops). 30s gives boot +
      # migration headroom without delaying detection of a genuinely dead
      # container, since failures during start_period don't count toward retries.
      start_period: 30s
      retries: 3
    # Solar bundles unpacked on the VPS by the deploy workflow are
    # mounted read-only into the container so Orion's static handler
    # at /static/solar/v{N.N.N}/* can serve them without re-baking
    # the image on every Solar release. The host directory is
    # populated per-version (./solar/v0.1.1/, ./solar/v0.1.2/, ...).
    volumes:
      - ./solar:/var/lib/orion/solar:ro
      # The software-P256 workload identity is provisioned on the VPS and is
      # never copied into the repository or image. Orion runs as nonroot and
      # reads this directory read-only for the client certificate, key and
      # Canvas resolved-scene-ref trust material.
      - /var/lib/zab/workload-orion:/etc/zab/workload-orion:ro
    deploy:
      resources:
        limits:
          memory: 512M
          # CPU isolation (ADR 003 §3.1.6/§5 — R7/B7). Time-slicing protects
          # the scene *loop*, not the host: a validated-then-pathological scene
          # can still burn CPU. Doctrine forbids killing/amputating the scene,
          # so the machine is protected by OS-level isolation instead — a
          # runaway scene saturates *this* cgroup, degrading its own scene,
          # never the show or co-tenant services on the shared VPS.
          #
          # docker compose (Compose Spec, not Swarm) honours
          # deploy.resources.limits.cpus on `up` by translating it to the
          # container's CPU quota (cgroup cpu.max). 1.0 = at most one full core.
          #
          # Sizing rationale (recalibrated post-nproc, ADR 006 P-3 / #108).
          # The VPS is a shared multi-service OVH host (G2 + Zab + Observer +
          # Bushido + Citadel stacks on one box). `nproc` on vps-ovh confirmed
          # 2026-06-10: **8 vCPU**, 22 GiB RAM. The #89 cap of 1.0 was posted
          # conservatively when SSH was unavailable (it assumed a possible
          # 2-vCPU tier); the real box is far larger.
          #
          # Cap set to 2.0 = at most two full cores = **25% of the host**.
          #   - Headroom: a single runaway scene saturates this cgroup at 2
          #     cores and can NEVER approach host saturation — 6 cores (75%)
          #     stay free for ZabGate, the live show, and every co-tenant. Host
          #     load contribution from a pinned Orion stays ~2/8.
          #   - Show fitness: exec goes live soon (R9-lift, ADR 006). When a
          #     scene's legitimate exec load and a runaway share THIS cgroup,
          #     1.0 would throttle the show itself; 2.0 lets a busy-but-legit
          #     scene have a full core of slack above a one-core runaway floor.
          #   - Not higher: 4.0 would hand half the host to one app cgroup whose
          #     normal footprint is ~2% (7 MiB idle, exec dormant). 2.0 keeps a
          #     strict protective host cap while covering the show.
          # Recalibrate again if the co-tenant mix or VPS plan changes — see
          # runbook docs/runbooks/orion-cpu-pathological-scene.md §Sizing.
          #
          # Worker-pool coherence (P-3, étage-1 .env): ORION_EFFECT_WORKERS must
          # stay ~2x this cap (effects are I/O-bound — http/db/source — so a
          # little over-subscription hides latency, but 8 workers on a 2-core
          # quota over-subscribes the cgroup). Recommend ORION_EFFECT_WORKERS=4
          # (default 8 is now incoherent with the cap); ORION_EFFECT_QUEUE=256
          # default holds (memory backpressure, not CPU).
          cpus: "2.0"
        reservations:
          memory: 128M
    networks:
      zab-internal:
        aliases:
          - orion
          - orion-api

  # Dedicated workload identity agent for Orion. It is deliberately separate
  # from ZabGate's agent: the same node proof key is used, but the challenge
  # binding and issued certificate are for the Orion workload SAN.
  orion-workload-identity-agent:
    image: zabgate-workload-identity-agent
    container_name: orion-workload-identity-agent
    restart: unless-stopped
    user: "1000:1000"
    command: ["uvicorn", "zabgate.identity_agent.server:app", "--uds", "/run/zab/workload-agent.sock"]
    environment:
      AUTH_URL: https://zabauth-workload.internal:4401
      AUTH_CA_CERTIFICATE: /etc/zab/workload/ca.pem
      NODE_CERTIFICATE: /etc/zab/workload/node-cert.pem
      NODE_KEY_REFERENCE: /etc/zab/workload/node-key.pem
      NODE_SAN: spiffe://zab/node/production/node-1
      GATE_CERTIFICATE: /etc/zab/workload/gate-cert.pem
      GATE_KEY_REFERENCE: /etc/zab/workload/gate-mtls-key.pem
      GATE_SAN: spiffe://zab/workload/zabgate/production/gate-1
      GATE_SIGNING_KEY_ID: gate-software-p256-2026-01
      GATE_SIGNING_KEY_REFERENCE: /etc/zab/workload/gate-signing-key.pem
      SOFTWARE_P256_KEY_REFERENCE: /etc/zab/workload/node-key.pem
      WORKLOAD_KEY_BACKEND: software-p256
      NODE_ID: node-1
      AGENT_ID: identity-agent-1
      WORKLOAD_ENVIRONMENT: production
      WORKLOAD_INSTANCE_ID: orion-1
      WORKLOAD_NAME: orion
      WORKLOAD_IDENTITY_AGENT_SOCKET: /run/zab/workload-agent.sock
    volumes:
      - /var/lib/zab/workload:/etc/zab/workload:ro
      - /var/lib/zab/workload-orion-agent:/run/zab
    networks:
      zab-internal:
        aliases:
          - orion-workload-identity-agent

  orion-db:
    # Digest verified against Docker Hub on 2026-08-14; update only through a
    # reviewed dependency/toolchain change.
    image: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
    container_name: orion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ORION_PG_USER:-orion}
      POSTGRES_PASSWORD: ${ORION_PG_PASSWORD}
      POSTGRES_DB: ${ORION_PG_DB:-orion}
    volumes:
      - orion_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      zab-internal:
        aliases:
          - orion-postgres
          - orion-db

volumes:
  orion_pg_data:
    name: orion_pg_data

networks:
  zab-internal:
    external: true

secrets:
  # The deploy workflow exposes this only to the BuildKit build process so
  # the private Blue runtime module can be fetched. It is never written to
  # .env or copied into the resulting image.
  blue_read_token:
    environment: BLUE_READ_TOKEN
