name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-orion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USERNAME }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ] || [ -z "${{ secrets.VPS_APP_PATH }}" ] || [ -z "${{ secrets.ORION_PG_PASSWORD }}" ] || [ -z "${{ secrets.ORION_ENCRYPTION_KEY }}" ]; then
            echo "::error::Missing required secrets (VPS_*, ORION_PG_PASSWORD, ORION_ENCRYPTION_KEY)"
            exit 1
          fi

  deploy:
    name: Deploy
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ensure target dir exists
        env:
          SSH_CMD: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}
          APP_PATH: ${{ secrets.VPS_APP_PATH }}
        run: |
          $SSH_CMD "mkdir -p '$APP_PATH' && ls -ld '$APP_PATH'"

      - name: Sync code to VPS
        env:
          SSH_OPTS: -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new
          TARGET: ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_PATH }}
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude '.ruff_cache' \
            --exclude '.mypy_cache' \
            --exclude '.env' \
            --exclude '.env.*' \
            -e "ssh $SSH_OPTS" \
            ./ "$TARGET/"

      - name: Write remote .env
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          APP_PATH: ${{ secrets.VPS_APP_PATH }}
          ORION_PG_PASSWORD: ${{ secrets.ORION_PG_PASSWORD }}
          ORION_ENCRYPTION_KEY: ${{ secrets.ORION_ENCRYPTION_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          PUBLIC_BASE_URL: ${{ secrets.ORION_PUBLIC_BASE_URL }}
          MEDIAMTX_PUBLIC_WHIP_BASE: ${{ secrets.ORION_PUBLIC_WHIP_BASE }}
          TWITCH_OAUTH_REDIRECT_URI: ${{ secrets.ORION_TWITCH_OAUTH_REDIRECT_URI }}
        run: |
          # Build locally (cleaner than indented heredocs over SSH) then scp over.
          umask 077
          cat > .env.remote <<ENV
          DEBUG=false
          DATABASE_URL=postgresql+asyncpg://orion:${ORION_PG_PASSWORD}@orion-postgres:5432/orion
          ORION_PG_USER=orion
          ORION_PG_PASSWORD=${ORION_PG_PASSWORD}
          ORION_PG_DB=orion
          ENCRYPTION_KEY=${ORION_ENCRYPTION_KEY}
          MEDIAMTX_API_URL=http://orion-mediamtx:9997
          MEDIAMTX_WHIP_BASE=http://orion-mediamtx:8889
          MEDIAMTX_PUBLIC_WHIP_BASE=${MEDIAMTX_PUBLIC_WHIP_BASE}
          TWITCH_RTMP_BASE=rtmp://live.twitch.tv/app
          TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
          TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
          TWITCH_OAUTH_REDIRECT_URI=${TWITCH_OAUTH_REDIRECT_URI}
          PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
          ENV
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            .env.remote "${VPS_USERNAME}@${VPS_HOST}:${APP_PATH}/.env"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${VPS_USERNAME}@${VPS_HOST}" "chmod 600 ${APP_PATH}/.env"

      - name: Build, migrate, restart
        env:
          SSH_CMD: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}
          APP_PATH: ${{ secrets.VPS_APP_PATH }}
        run: |
          $SSH_CMD bash -s -- "$APP_PATH" << 'DEPLOY_SCRIPT'
          set -euo pipefail
          APP_PATH="$1"
          cd "$APP_PATH"

          echo "=== Network preflight ==="
          # Orion uses both networks: zab-internal for the API control
          # plane and caddy-public for the MediaMTX media endpoint
          # (orion-media.cyell.dev). Idempotent so re-deploys are no-ops.
          for net in zab-internal caddy-public; do
            if ! docker network inspect "$net" >/dev/null 2>&1; then
              echo "  Creating missing network: $net"
              docker network create "$net"
            else
              echo "  Network present: $net"
            fi
          done

          echo "=== Build ==="
          docker compose -f docker-compose.prod.yml build --quiet

          echo "=== Ensure DB is up ==="
          docker compose -f docker-compose.prod.yml up -d orion-db
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yml ps orion-db | grep -q healthy; then break; fi
            sleep 2
          done

          echo "=== Migrate ==="
          docker compose -f docker-compose.prod.yml run --rm -T orion alembic upgrade head < /dev/null

          echo "=== Up all services ==="
          docker compose -f docker-compose.prod.yml up -d
          docker compose -f docker-compose.prod.yml up -d --force-recreate orion

          echo "=== Health (internal) ==="
          sleep 5
          HEALTHY=0
          for i in $(seq 1 15); do
            if docker run --rm --network zab-internal curlimages/curl:latest -sf http://orion:4007/health > /dev/null 2>&1; then
              HEALTHY=1; break
            fi
            echo "  Waiting... ($i/15)"; sleep 3
          done
          if [ $HEALTHY -eq 0 ]; then
            echo "::error::Internal health check failed"
            docker compose -f docker-compose.prod.yml logs --tail=50 orion
            exit 1
          fi
          echo "Orion healthy"
          DEPLOY_SCRIPT

      - name: Smoke test via gateway
        env:
          SSH_CMD: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}
        run: |
          $SSH_CMD 'docker run --rm --network caddy-public curlimages/curl:latest -s -o /dev/null -w "%{http_code}" http://zabgate:4000/ready | grep -E "200|503"' || echo "::warning::Gateway /ready not reachable yet"
