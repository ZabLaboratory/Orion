name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR re-pushes cancel in-progress runs (saves runner minutes when
# someone amends a branch). Main pushes never cancel — once a deploy
# job is queued or running, a follow-up push must wait its turn.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: build (e2e tag)
        run: go build -tags e2e ./...

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: run
        run: staticcheck ./...

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      # Install golangci-lint from source so it uses *our* Go
      # toolchain. The pre-built binaries (released ~v1.64) were
      # built with Go 1.24 and refuse modules declaring `go 1.26`.
      - name: install golangci-lint from source
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: run
        run: golangci-lint run --timeout=5m

  docker:
    name: docker-build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image
        run: docker buildx build -t orion:ci .

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    # PR-only: on push events post-merge HEAD == BASE so TruffleHog
    # has nothing to diff. Pre-merge PR scans catch every introduced
    # secret.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

  # ---- Deploy pipeline (push to main only) -------------------------------
  # Preflight runs in parallel with the CI jobs so a missing-secret
  # error surfaces fast even if CI is slow. The deploy job itself
  # gates on every CI job + preflight succeeding.

  preflight-deploy:
    name: Preflight (deploy secrets)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USERNAME }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ] || [ -z "${{ secrets.VPS_APP_PATH }}" ] || [ -z "${{ secrets.ORION_PG_PASSWORD }}" ] || [ -z "${{ secrets.ORION_SERVICE_TOKEN }}" ]; then
            echo "::error::Missing required secrets (VPS_HOST, VPS_USERNAME, VPS_SSH_KEY, VPS_APP_PATH, ORION_PG_PASSWORD, ORION_SERVICE_TOKEN)"
            exit 1
          fi

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, staticcheck, golangci-lint, docker, preflight-deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level concurrency: a follow-up push to main lines up behind
    # the in-flight deploy rather than cancelling it. The CI jobs above
    # share the workflow-level concurrency group which only cancels on
    # pull_request events.
    concurrency:
      group: deploy-orion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ensure target dir exists
        env:
          SSH_CMD: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}
          APP_PATH: ${{ secrets.VPS_APP_PATH }}
        run: |
          $SSH_CMD "mkdir -p '$APP_PATH' && ls -ld '$APP_PATH'"

      - name: Sync code to VPS
        env:
          SSH_OPTS: -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new
          TARGET: ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_PATH }}
        run: |
          # solar/ is populated on the VPS by the next step from Solar
          # GitHub Releases ; rsync must not delete it.
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'bin' \
            --exclude 'dist' \
            --exclude 'coverage.out' \
            --exclude 'coverage.html' \
            --exclude 'solar' \
            -e "ssh $SSH_OPTS" \
            ./ "$TARGET/"

      - name: Install Solar bundles
        env:
          SSH_CMD: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}
          APP_PATH: ${{ secrets.VPS_APP_PATH }}
          # Pinned versions consumed by Orion's static handler at
          # /static/solar/v{N.N.N}/*. Bumping here in a PR is the
          # operational handle to roll Pulsar CEF / browser hosts
          # forward to a new Solar release. Multiple values supported
          # to allow canarying a new version alongside the previous.
          SOLAR_VERSIONS: "v0.1.1"
        run: |
          $SSH_CMD bash -s -- "$APP_PATH" "$SOLAR_VERSIONS" << 'INSTALL_SCRIPT'
          set -euo pipefail
          APP_PATH="$1"
          VERSIONS="$2"
          mkdir -p "$APP_PATH/solar"
          cd "$APP_PATH/solar"
          for v in $VERSIONS; do
            target="$APP_PATH/solar/$v"
            mkdir -p "$target"
            if [ -f "$target/.installed" ]; then
              echo "→ Solar $v already installed, skipping"
              continue
            fi
            tmp=$(mktemp -d)
            gh release download "$v" -R ZabLaboratory/Solar -p 'solar-*.tgz' --dir "$tmp"
            tar -xzf "$tmp"/solar-*.tgz -C "$target"
            rm -rf "$tmp"
            # Marker is the success signal — set last so a partial
            # extract leaves the directory unmarked and the next
            # deploy retries.
            touch "$target/.installed"
            echo "✓ installed Solar $v at $target"
            ls -la "$target/" | head -10
          done
          echo "=== Final layout ==="
          find "$APP_PATH/solar" -maxdepth 2 -type d
          INSTALL_SCRIPT

      - name: Write remote .env
        env:
          SSH_CMD: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}
          APP_PATH: ${{ secrets.VPS_APP_PATH }}
          ORION_PG_PASSWORD: ${{ secrets.ORION_PG_PASSWORD }}
          ORION_SERVICE_TOKEN: ${{ secrets.ORION_SERVICE_TOKEN }}
          ORION_OPERATOR_TOKEN: ${{ secrets.ORION_OPERATOR_TOKEN }}
        run: |
          $SSH_CMD "cat > $APP_PATH/.env && chmod 600 $APP_PATH/.env" << EOF
          # Public surface
          ORION_LISTEN_ADDR=0.0.0.0:4007
          ORION_INTERNAL_ADDR=0.0.0.0:4017
          ORION_PUBLIC_BASE_URL=https://zabgate.cyell.dev/orion

          # Database — orion-postgres on zab-internal
          ORION_DATABASE_URL=postgres://orion:$ORION_PG_PASSWORD@orion-postgres:5432/orion?sslmode=disable
          ORION_PG_USER=orion
          ORION_PG_PASSWORD=$ORION_PG_PASSWORD
          ORION_PG_DB=orion

          # Filesystem roots
          ORION_ASSET_ROOT=/var/lib/orion/assets
          ORION_SOLAR_ROOT=/var/lib/orion/solar

          # Auth — Orion validates show-tokens against ZabAuth via the gateway.
          ORION_ZABAUTH_VALIDATE_URL=http://zabgate:4000/auth/api/v1/tokens
          ORION_AUTH_CACHE_TTL_S=60
          ORION_SERVICE_TOKEN=$ORION_SERVICE_TOKEN

          # Live service-token mint + refresh — when ORION_OPERATOR_TOKEN
          # is set, Orion mints a fresh token at boot and rotates it
          # before expiry. Empty operator token → static fallback above.
          ORION_OPERATOR_TOKEN=$ORION_OPERATOR_TOKEN
          ORION_SERVICE_PATHS=quasar.credentials.read

          # Upstream services (compile-time fetch through the gateway)
          ORION_CANVAS_BASE_URL=http://zabgate:4000/canvas
          ORION_BLUE_BASE_URL=http://zabgate:4000/blue
          ORION_QUASAR_BASE_URL=http://zabgate:4000/quasar

          # Runtime
          ORION_TICK_HZ=60
          ORION_PUSH_TIMEOUT_S=10
          ORION_HTTP_POLL_USER_AGENT=orion-poller/1.0
          ORION_LOG_LEVEL=info
          ORION_LOG_FORMAT=json
          EOF

      - name: Build, migrate, restart
        env:
          SSH_CMD: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}
          APP_PATH: ${{ secrets.VPS_APP_PATH }}
        run: |
          $SSH_CMD bash -s -- "$APP_PATH" << 'DEPLOY_SCRIPT'
          set -euo pipefail
          APP_PATH="$1"
          cd "$APP_PATH"

          echo "=== Network preflight ==="
          # zab-internal is the shared backend network; caddy-public is
          # the gateway's outward-facing one. Both must exist before
          # compose up (idempotent).
          for net in caddy-public zab-internal; do
            if ! docker network inspect "$net" >/dev/null 2>&1; then
              echo "  Creating missing network: $net"
              docker network create "$net"
            else
              echo "  Network present: $net"
            fi
          done

          echo "=== Build ==="
          docker compose -f docker-compose.prod.yml build --quiet

          echo "=== Ensure DB is up ==="
          docker compose -f docker-compose.prod.yml up -d orion-db
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yml ps orion-db | grep -q healthy; then break; fi
            sleep 2
          done

          echo "=== Migrate (goose) ==="
          # The runtime image bundles /goose alongside /orion for exactly
          # this purpose. -T disables the pseudo-tty so the heredoc stdin
          # doesn't bleed into the compose run.
          docker compose -f docker-compose.prod.yml run --rm -T \
            --entrypoint /goose orion \
            -dir /migrations postgres \
            "$(grep '^ORION_DATABASE_URL=' .env | cut -d= -f2-)" up < /dev/null

          echo "=== Up all services ==="
          docker compose -f docker-compose.prod.yml up -d
          docker compose -f docker-compose.prod.yml up -d --force-recreate orion

          echo "=== Health (internal) ==="
          sleep 5
          HEALTHY=0
          for i in $(seq 1 15); do
            if docker run --rm --network zab-internal curlimages/curl:latest -sf http://orion:4007/api/v1/health > /dev/null 2>&1; then
              HEALTHY=1; break
            fi
            echo "  Waiting... ($i/15)"; sleep 3
          done
          if [ $HEALTHY -eq 0 ]; then
            echo "::error::Internal health check failed"
            docker compose -f docker-compose.prod.yml logs --tail=50 orion
            exit 1
          fi
          echo "Orion healthy"
          DEPLOY_SCRIPT

      - name: Smoke test via gateway
        env:
          SSH_CMD: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}
        run: |
          # Gateway-first: the deploy must validate the full
          # Caddy + DNS + TLS path, not just the container. /orion/api/v1/health
          # is unauthenticated per ADR 004 § 2 so we can probe it directly.
          $SSH_CMD 'curl -fsS --max-time 5 https://zabgate.cyell.dev/orion/api/v1/health > /dev/null' \
            || (echo "::error::Public gateway probe failed (Caddy/DNS/TLS or routing)"; \
                $SSH_CMD 'docker compose -f '"${{ secrets.VPS_APP_PATH }}"'/docker-compose.prod.yml logs --tail=50 orion'; \
                exit 1)
          echo "Orion reachable via https://zabgate.cyell.dev/orion/*"
