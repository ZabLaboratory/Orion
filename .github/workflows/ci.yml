name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Self-hosted runners on vps-ovh (org GitHub Actions billing frozen).
# All jobs run on the shared org-scoped ephemeral pool (label `vps-ovh`).
# No Docker daemon in the runner:
#   - the `e2e` job uses PostgreSQL natively (no `services: postgres`
#     container is possible without a Docker socket). It is idempotent +
#     privilege-aware: it skips apt entirely when PG is already provisioned
#     on the runner image, and only installs (with a lock-retry) on a fresh
#     runner — so it stays green whatever the ephemeral runner's state,
#   - the old `docker-build` smoke job is dropped (the deploy's
#     `docker compose build` on the host covers Dockerfile validity),
#   - trufflehog runs as the native binary (the docker action exits 125).
# setup-go downloads the toolchain on the runner. CI on PR only; merge to
# main triggers deploy.yml.
# ---------------------------------------------------------------------------

jobs:
  build:
    name: build-test
    runs-on: [self-hosted, vps-ovh]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          # cache disabled on purpose (all 8 Go jobs). The setup-go cache
          # never helps on this self-hosted pool: runners are EPHEMERAL so
          # the on-disk Go cache never survives, and the GitHub Actions cache
          # service is remote+slow from the VPS — observed 100% restore miss
          # ("Cache is not found") and ~7/8 save failures ("Unable to reserve
          # cache, another job may be creating this cache") because 8 parallel
          # jobs race the same key. The save step tarred ~1.1 GB (GOMODCACHE +
          # GOCACHE) and uploaded at ~0.6 MB/s, hanging the job 30+ min for
          # zero benefit. With cache off, `go` re-fetches from the module
          # proxy in seconds. Re-enable only behind a fast local cache backend.
          cache: false
      # go.mod pulls github.com/ZabLaboratory/Blue/runtime/go, a private
      # cross-repo module (issue #331). `go mod download` needs a scoped
      # token to clone it — the ORION_BLUE_READ_APP_ID/PRIVATE_KEY secrets are
      # a dedicated App (orion-blue-read), read-only on Blue only, separate
      # from ZabCanvas's own blue-read App (private keys are not shared
      # across Apps). Bastion veto on #342 (F1/F2/F3): the credential must
      # never be live while a step runs PR-submitted code (`go test`/
      # `golangci-lint`/`go install` can read
      # `~/.gitconfig` and exfiltrate it), and `insteadOf` must not rewrite
      # every `https://github.com/` clone, only `ZabLaboratory/`. Fixed here:
      # mint → write the scoped rewrite → download/tidy → unset, all inside
      # one step's process, before any later step touches PR code.
      - name: mint Blue-read App token for private Go module fetch
        id: blue-read-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORION_BLUE_READ_APP_ID }}
          private-key: ${{ secrets.ORION_BLUE_READ_APP_PRIVATE_KEY }}
          owner: ZabLaboratory
          repositories: Blue
      - name: fetch private Go module (scoped credential, cleared immediately)
        env:
          GH_TOKEN: ${{ steps.blue-read-app-token.outputs.token }}
        run: |
          # Jobs of the same run execute CONCURRENTLY on this shared,
          # non-containerized self-hosted runner (confirmed by overlapping
          # job start/end timestamps) — `git config --global` mutates a
          # single ~/.gitconfig shared across all of them. Job A's cleanup
          # `--unset` at its own end could race and strip job B's insteadOf
          # mid-fetch, producing an intermittent "Invalid username or token"
          # with no stale-cache involved. Scope the config to this job only.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-blue-read-$GITHUB_JOB"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/ZabLaboratory/".insteadOf "https://github.com/ZabLaboratory/"
          export GOPRIVATE=github.com/ZabLaboratory/*
          # The self-hosted runner container is reused across jobs of the
          # same workflow run: the Go module VCS cache can hold a bare repo
          # for ZabLaboratory/Blue created under a PREVIOUS job's App token,
          # already auto-revoked at that job's end (`skip-token-revoke:
          # false`). Reusing it here fails with "Invalid username or token"
          # even though THIS job's token is fresh and valid. A first fix
          # tried matching `git remote get-url origin` per cache/vcs/<hash>
          # dir and deleting only the Blue one — it never fired: `go mod`'s
          # internal git codehost bare repos don't carry a remote named
          # `origin` (confirmed: purge loop ran, same poisoned hash dir
          # survived, same failure). Unconditional wipe instead: cheap (only
          # Blue is fetched via direct VCS/insteadOf; every other module goes
          # through GOPROXY's separate `cache/download` mechanism, untouched
          # by this).
          rm -rf "$(go env GOMODCACHE)/cache/download/github.com/!zab!laboratory"
          rm -rf "$(go env GOMODCACHE)/cache/vcs"
          go mod download
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          rm -f "$GIT_CONFIG_GLOBAL"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: build (e2e tag)
        run: go build -tags e2e ./...

  e2e:
    name: e2e (Postgres)
    runs-on: [self-hosted, vps-ovh]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    env:
      ORION_E2E_DATABASE_URL: postgres://orion:orion_e2e_ci@localhost:5432/orion_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - name: Start PostgreSQL natively (no Docker on the runner)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # Privilege-aware sudo shim: the org-scoped ephemeral runner image
          # (myoung34/github-runner) usually runs jobs as root, but the
          # effective user has varied across runs — a non-root, no-sudo
          # runner made the unconditional `apt-get` fail with
          # "Permission denied" on /var/lib/apt/lists/lock (the flake this
          # step fixes). Resolve a privilege-escalation prefix once, or empty
          # when already root.
          if [ "$(id -u)" = "0" ]; then SUDO=; elif command -v sudo >/dev/null 2>&1; then SUDO="sudo -n"; else SUDO=; fi

          # Install PostgreSQL ONLY if it is not already provisioned. On a
          # pre-provisioned runner image this is a no-op (no apt, no lock, no
          # privilege needed) — durable regardless of runner state. A fresh
          # runner installs it once, guarding the apt lock with a short retry
          # so a transient lock contention does not hard-fail the job.
          if ! command -v pg_ctlcluster >/dev/null 2>&1; then
            echo "PostgreSQL not present — installing via apt."
            for attempt in 1 2 3 4 5; do
              if $SUDO apt-get update -qq && \
                 $SUDO apt-get install -y -qq postgresql postgresql-client; then
                break
              fi
              if [ "$attempt" = "5" ]; then
                echo "::error::apt-get failed after 5 attempts (lock/permission). Pre-provision PostgreSQL on the runner image." >&2
                exit 1
              fi
              echo "apt-get attempt $attempt failed (lock/permission?) — retrying in 5s." >&2
              sleep 5
            done
          else
            echo "PostgreSQL already provisioned ($(pg_lsclusters -h | awk 'NR==1{print $1, $2}')) — skipping apt."
          fi

          PGVER=$(pg_lsclusters -h | awk 'NR==1{print $1}')
          # Canary (ADR 018 §3.2, R-7): the runner pool is pinned to PostgreSQL
          # 16 (Orion#317). Fail explicitly, not silently, if the provisioned
          # cluster ever drifts off that major — a green e2e run against the
          # wrong PG major is a weaker oracle than a red one.
          if [ "$PGVER" != "16" ]; then
            echo "::error::PostgreSQL major version mismatch: expected 16, got $PGVER (ADR 018 §3.2)." >&2
            exit 1
          fi
          # Cluster start needs the postgres-cluster privilege; run via the
          # same shim. Idempotent: start, else restart an already-running one.
          $SUDO pg_ctlcluster "$PGVER" main start || $SUDO pg_ctlcluster "$PGVER" main restart
          for i in $(seq 1 30); do pg_isready -h localhost -p 5432 && break; sleep 1; done
          # Idempotent bootstrap. The org runner pool is EPHEMERAL, so the PG
          # cluster does NOT persist across runs — but a pre-provisioned image
          # may carry residual `orion` role / `orion_e2e` DB. Either way we
          # start each run from a clean, known state: drop the DB (terminating
          # live backends first), recreate the role guarded by an existence
          # check, then recreate a fresh DB — so ON_ERROR_STOP=1 never aborts
          # on a residual object. SQL is staged to a file then run as the
          # postgres OS user — avoids nesting a heredoc inside `su -c "..."`
          # (which would not expand).
          cat > /tmp/orion_e2e_bootstrap.sql <<'SQL'
          SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'orion_e2e' AND pid <> pg_backend_pid();
          DROP DATABASE IF EXISTS orion_e2e;
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'orion') THEN
              CREATE ROLE orion LOGIN PASSWORD 'orion_e2e_ci' SUPERUSER;
            ELSE
              ALTER ROLE orion LOGIN PASSWORD 'orion_e2e_ci' SUPERUSER;
            END IF;
          END
          $$;
          CREATE DATABASE orion_e2e OWNER orion;
          SQL
          chmod 644 /tmp/orion_e2e_bootstrap.sql
          $SUDO su - postgres -c "psql -v ON_ERROR_STOP=1 -f /tmp/orion_e2e_bootstrap.sql"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: mint Blue-read App token for private Go module fetch
        id: blue-read-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORION_BLUE_READ_APP_ID }}
          private-key: ${{ secrets.ORION_BLUE_READ_APP_PRIVATE_KEY }}
          owner: ZabLaboratory
          repositories: Blue
      - name: fetch private Go module (scoped credential, cleared immediately)
        env:
          GH_TOKEN: ${{ steps.blue-read-app-token.outputs.token }}
        run: |
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-blue-read-$GITHUB_JOB"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/ZabLaboratory/".insteadOf "https://github.com/ZabLaboratory/"
          export GOPRIVATE=github.com/ZabLaboratory/*
          # See build-test's fetch step: runner container is reused across
          # jobs, purge any stale Blue VCS clone carrying a revoked token.
          rm -rf "$(go env GOMODCACHE)/cache/download/github.com/!zab!laboratory"
          rm -rf "$(go env GOMODCACHE)/cache/vcs"
          go mod download
          rm -f "$GIT_CONFIG_GLOBAL"
      # Whole tests/e2e tree: the Probe-authored API contract tests
      # (tests/e2e/contract/, ADR-002 §6) AND the Forge e2e tests.
      - name: run e2e tests (ADR-002 §6 contract + Forge e2e)
        run: go test -v -tags e2e -count=1 -timeout 120s ./tests/e2e/...

  perf-20k:
    # 20 k-node performance regression gate (issue #80, ADR 003 §3.1.5).
    # HARD-FAILS if cold-start > 2 s or single-input→delta p95 > 50 ms.
    name: perf-20k gate
    runs-on: [self-hosted, vps-ovh]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: mint Blue-read App token for private Go module fetch
        id: blue-read-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORION_BLUE_READ_APP_ID }}
          private-key: ${{ secrets.ORION_BLUE_READ_APP_PRIVATE_KEY }}
          owner: ZabLaboratory
          repositories: Blue
      - name: fetch private Go module (scoped credential, cleared immediately)
        env:
          GH_TOKEN: ${{ steps.blue-read-app-token.outputs.token }}
        run: |
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-blue-read-$GITHUB_JOB"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/ZabLaboratory/".insteadOf "https://github.com/ZabLaboratory/"
          export GOPRIVATE=github.com/ZabLaboratory/*
          # See build-test's fetch step: runner container is reused across
          # jobs, purge any stale Blue VCS clone carrying a revoked token.
          rm -rf "$(go env GOMODCACHE)/cache/download/github.com/!zab!laboratory"
          rm -rf "$(go env GOMODCACHE)/cache/vcs"
          go mod download
          rm -f "$GIT_CONFIG_GLOBAL"
      - name: run 20k benchmark gate
        run: go test -v -count=1 -run 'TestPerf20k' ./internal/runtime/

  conformance-matrix:
    # Total-conformance matrix (issue #88, ADR 003 §6 criterion 1).
    # HARD-FAILS if any Blue manifest node is unserved/off-allowlist, the
    # allowlist grows, the id→executor classification drifts, or any served
    # executor fails through the real engine.
    name: conformance-matrix gate
    runs-on: [self-hosted, vps-ovh]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: mint Blue-read App token for private Go module fetch
        id: blue-read-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORION_BLUE_READ_APP_ID }}
          private-key: ${{ secrets.ORION_BLUE_READ_APP_PRIVATE_KEY }}
          owner: ZabLaboratory
          repositories: Blue
      - name: fetch private Go module (scoped credential, cleared immediately)
        env:
          GH_TOKEN: ${{ steps.blue-read-app-token.outputs.token }}
        run: |
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-blue-read-$GITHUB_JOB"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/ZabLaboratory/".insteadOf "https://github.com/ZabLaboratory/"
          export GOPRIVATE=github.com/ZabLaboratory/*
          # See build-test's fetch step: runner container is reused across
          # jobs, purge any stale Blue VCS clone carrying a revoked token.
          rm -rf "$(go env GOMODCACHE)/cache/download/github.com/!zab!laboratory"
          rm -rf "$(go env GOMODCACHE)/cache/vcs"
          go mod download
          rm -f "$GIT_CONFIG_GLOBAL"
      - name: structural matrix + ratchet + registry cross-check
        run: go test -v -count=1 ./internal/conformance/
      - name: every served executor runs through the real engine
        run: go test -v -count=1 -run 'TestConformance_Every' ./internal/runtime/

  exec-port-parity:
    # Exec-port-parity gate (Conduit). HARD-FAILS if any port/config name the
    # runtime hardcodes for a served node is absent from that node's Blue seed
    # signature, or a seed EXEC pin is dropped by the runtime.
    name: exec-port-parity gate
    runs-on: [self-hosted, vps-ovh]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: mint Blue-read App token for private Go module fetch
        id: blue-read-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORION_BLUE_READ_APP_ID }}
          private-key: ${{ secrets.ORION_BLUE_READ_APP_PRIVATE_KEY }}
          owner: ZabLaboratory
          repositories: Blue
      - name: fetch private Go module (scoped credential, cleared immediately)
        env:
          GH_TOKEN: ${{ steps.blue-read-app-token.outputs.token }}
        run: |
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-blue-read-$GITHUB_JOB"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/ZabLaboratory/".insteadOf "https://github.com/ZabLaboratory/"
          export GOPRIVATE=github.com/ZabLaboratory/*
          # See build-test's fetch step: runner container is reused across
          # jobs, purge any stale Blue VCS clone carrying a revoked token.
          rm -rf "$(go env GOMODCACHE)/cache/download/github.com/!zab!laboratory"
          rm -rf "$(go env GOMODCACHE)/cache/vcs"
          go mod download
          rm -f "$GIT_CONFIG_GLOBAL"
      - name: seed-vs-runtime port/config parity
        run: go test -v -count=1 -run 'TestExecPortParity' ./internal/conformance/
      - name: cross-repo QueryDescriptor golden parity (Orion arm)
        run: go test -v -count=1 -run 'TestQueryDescriptor_GoldenParity' ./internal/runtime/

  staticcheck:
    name: staticcheck
    runs-on: [self-hosted, vps-ovh]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: mint Blue-read App token for private Go module fetch
        id: blue-read-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORION_BLUE_READ_APP_ID }}
          private-key: ${{ secrets.ORION_BLUE_READ_APP_PRIVATE_KEY }}
          owner: ZabLaboratory
          repositories: Blue
      - name: fetch private Go module (scoped credential, cleared immediately)
        env:
          GH_TOKEN: ${{ steps.blue-read-app-token.outputs.token }}
        run: |
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-blue-read-$GITHUB_JOB"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/ZabLaboratory/".insteadOf "https://github.com/ZabLaboratory/"
          export GOPRIVATE=github.com/ZabLaboratory/*
          # See build-test's fetch step: runner container is reused across
          # jobs, purge any stale Blue VCS clone carrying a revoked token.
          rm -rf "$(go env GOMODCACHE)/cache/download/github.com/!zab!laboratory"
          rm -rf "$(go env GOMODCACHE)/cache/vcs"
          go mod download
          rm -f "$GIT_CONFIG_GLOBAL"
      - name: install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: run
        run: staticcheck ./...

  govulncheck:
    name: govulncheck
    runs-on: [self-hosted, vps-ovh]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: mint Blue-read App token for private Go module fetch
        id: blue-read-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORION_BLUE_READ_APP_ID }}
          private-key: ${{ secrets.ORION_BLUE_READ_APP_PRIVATE_KEY }}
          owner: ZabLaboratory
          repositories: Blue
      - name: fetch private Go module (scoped credential, cleared immediately)
        env:
          GH_TOKEN: ${{ steps.blue-read-app-token.outputs.token }}
        run: |
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-blue-read-$GITHUB_JOB"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/ZabLaboratory/".insteadOf "https://github.com/ZabLaboratory/"
          export GOPRIVATE=github.com/ZabLaboratory/*
          # See build-test's fetch step: runner container is reused across
          # jobs, purge any stale Blue VCS clone carrying a revoked token.
          rm -rf "$(go env GOMODCACHE)/cache/download/github.com/!zab!laboratory"
          rm -rf "$(go env GOMODCACHE)/cache/vcs"
          go mod download
          rm -f "$GIT_CONFIG_GLOBAL"
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: run
        run: govulncheck ./...

  golangci-lint:
    name: golangci-lint
    runs-on: [self-hosted, vps-ovh]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: mint Blue-read App token for private Go module fetch
        id: blue-read-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORION_BLUE_READ_APP_ID }}
          private-key: ${{ secrets.ORION_BLUE_READ_APP_PRIVATE_KEY }}
          owner: ZabLaboratory
          repositories: Blue
      - name: fetch private Go module (scoped credential, cleared immediately)
        env:
          GH_TOKEN: ${{ steps.blue-read-app-token.outputs.token }}
        run: |
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-blue-read-$GITHUB_JOB"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/ZabLaboratory/".insteadOf "https://github.com/ZabLaboratory/"
          export GOPRIVATE=github.com/ZabLaboratory/*
          # See build-test's fetch step: runner container is reused across
          # jobs, purge any stale Blue VCS clone carrying a revoked token.
          rm -rf "$(go env GOMODCACHE)/cache/download/github.com/!zab!laboratory"
          rm -rf "$(go env GOMODCACHE)/cache/vcs"
          go mod download
          rm -f "$GIT_CONFIG_GLOBAL"
      # Install from source so it uses our Go toolchain (pre-built binaries
      # refuse modules declaring `go 1.26`).
      - name: install golangci-lint from source
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: run
        run: golangci-lint run --timeout=5m

  secret-scan:
    name: secret-scan
    runs-on: [self-hosted, vps-ovh]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install trufflehog
        # Native binary — the docker action exits 125 on the no-Docker runner.
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/bin" v3.90.10
          "$RUNNER_TEMP/bin/trufflehog" --version
      - name: trufflehog
        run: |
          "$RUNNER_TEMP/bin/trufflehog" git file://. --fail --no-update --results=verified
