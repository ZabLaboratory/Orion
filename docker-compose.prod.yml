services:
  orion:
    build: .
    container_name: orion
    restart: unless-stopped
    env_file: .env
    expose:
      - "4007"
    depends_on:
      orion-db:
        condition: service_healthy
      orion-mediamtx:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      zab-internal:
        aliases:
          - orion
          - orion-api

  orion-db:
    image: postgres:16-alpine
    container_name: orion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ORION_PG_USER:-orion}
      POSTGRES_PASSWORD: ${ORION_PG_PASSWORD}
      POSTGRES_DB: ${ORION_PG_DB:-orion}
    volumes:
      - orion_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      zab-internal:
        aliases:
          - orion-postgres
          - orion-db

  orion-mediamtx:
    # `latest-ffmpeg` bundles an ffmpeg binary next to MediaMTX — required
    # because Orion's runOnReady transcodes the browser's WebRTC VP8/Opus
    # stream into H264/AAC before pushing it to Twitch's RTMP ingress.
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: orion-mediamtx
    restart: unless-stopped
    # WebRTC + RTMP + HLS endpoints must be reachable by browsers and by Twitch's
    # RTMP push target. Caddy (host network) fronts these via `stream: true`
    # snippets configured outside the compose file.
    expose:
      - "9997"
      - "8554"
      - "8889"
      - "1935"
      - "8888"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    networks:
      zab-internal:
        aliases:
          - orion-mediamtx
      caddy-public:
        aliases:
          - orion-mediamtx-public

volumes:
  orion_pg_data:
    name: orion_pg_data

networks:
  zab-internal:
    external: true
  caddy-public:
    external: true
