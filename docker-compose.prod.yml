services:
  orion:
    build: .
    container_name: orion
    restart: unless-stopped
    env_file: .env
    expose:
      - "4007"
    depends_on:
      orion-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      zab-internal:
        aliases:
          - orion
          - orion-api

  orion-db:
    image: postgres:16-alpine
    container_name: orion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ORION_PG_USER:-orion}
      POSTGRES_PASSWORD: ${ORION_PG_PASSWORD}
      POSTGRES_DB: ${ORION_PG_DB:-orion}
    volumes:
      - orion_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      zab-internal:
        aliases:
          - orion-postgres
          - orion-db

volumes:
  orion_pg_data:
    name: orion_pg_data

networks:
  zab-internal:
    external: true
