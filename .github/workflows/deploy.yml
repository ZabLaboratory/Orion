name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-orion
  cancel-in-progress: false

# ---------------------------------------------------------------------------
# Self-hosted runners on vps-ovh (org GitHub Actions billing frozen).
# Runs on the shared org-scoped `vps-ovh` pool. SSHes to the public host IP
# and runs rsync + `docker compose` ON the host (no docker.sock in
# the runner). Triggered on push to main (= merge); the PR's CI (ci.yml)
# already gated the merge.
# ---------------------------------------------------------------------------

jobs:
  preflight:
    name: Preflight (deploy secrets)
    runs-on: [self-hosted, vps-ovh]
    timeout-minutes: 2
    steps:
      # The cutover of issue #307 happened: ORION_ENCRYPTION_KEY is now
      # required (ADR ZabAuth 003 Am.3 § A3.3 part 2). It is permanent — it
      # decrypts the durable refresh token every boot, so a deploy without it
      # puts Orion on the air with no service token.
      #
      # ORION_SERVICE_REFRESH_TOKEN is deliberately NOT required. It is an
      # amorce consumed by the first rotation and purged from the deploy path
      # afterwards (§ A3.7 step 2.6, § 5 R8): requiring it would either block
      # every deploy after the purge, or push an operator to keep a spent
      # generation wired — which trips `reuse` and revokes the live family the
      # first time the database resolution comes back empty.
      #
      # ORION_SERVICE_TOKEN / ORION_OPERATOR_TOKEN are retired outright
      # (§ A3.3 parts 5/6, RC 47): the antenne profile refuses the former and
      # the latter lost its last consumer with EgressTokenSource.
      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USERNAME }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ] || [ -z "${{ secrets.VPS_APP_PATH }}" ] || [ -z "${{ secrets.ORION_PG_PASSWORD }}" ] || [ -z "${{ secrets.ORION_ENCRYPTION_KEY }}" ]; then
            echo "::error::Missing required secrets (VPS_HOST, VPS_USERNAME, VPS_SSH_KEY, VPS_APP_PATH, ORION_PG_PASSWORD, ORION_ENCRYPTION_KEY)"
            exit 1
          fi

  deploy:
    name: Deploy
    needs: [preflight]
    runs-on: [self-hosted, vps-ovh]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # The production image downloads the private Blue runtime module during
      # the remote Docker build. Mint the same repository-scoped read token
      # used by CI; the deploy step passes it only as a BuildKit secret and
      # never persists it in the remote .env or image.
      - name: mint Blue-read App token for remote image build
        id: blue-read-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORION_BLUE_READ_APP_ID }}
          private-key: ${{ secrets.ORION_BLUE_READ_APP_PRIVATE_KEY }}
          owner: ZabLaboratory
          repositories: Blue

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ensure target dir exists
        env:
          SSH_CMD: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}
          APP_PATH: ${{ secrets.VPS_APP_PATH }}
        run: |
          $SSH_CMD "mkdir -p '$APP_PATH' && ls -ld '$APP_PATH'"

      - name: Sync code to VPS
        env:
          SSH_OPTS: -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new
          TARGET: ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_PATH }}
        run: |
          # solar/ is populated on the VPS from Solar GitHub Releases by the
          # next step; rsync must not delete it.
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'bin' \
            --exclude 'dist' \
            --exclude 'coverage.out' \
            --exclude 'coverage.html' \
            --exclude 'solar' \
            -e "ssh $SSH_OPTS" \
            ./ "$TARGET/"

      - name: Install Solar bundles
        env:
          SSH_CMD: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}
          APP_PATH: ${{ secrets.VPS_APP_PATH }}
          # Pinned Solar versions served at /static/solar/v{N.N.N}/*. Bump in a
          # PR to roll Pulsar CEF / browser hosts forward. Multiple values
          # allow canarying a new version alongside the previous.
          #
          # DURABILITY DEBT (2026-06-24, Keeper): v0.2.10 and v0.2.11 have NO
          # GitHub Release (Solar lost release.yml). They were hot-pushed to the
          # box manually from a local dist/host (runbook solar-v0.2.11-capture-
          # transparent-deploy.md). The install loop below skips any version
          # already carrying an .installed marker, so listing them here is a
          # no-op on the live box (no Release fetch attempted) — it documents
          # intent and keeps them from being treated as removable. BUT a fresh
          # box (disaster recovery) would FAIL on the curl for v0.2.10/v0.2.11
          # since the Release asset does not exist. To make these reproducible,
          # cut real Solar Releases for v0.2.10/v0.2.11 (restore release.yml),
          # or re-hot-push from a vendored dist. Until then these two are NOT
          # reproducible via this workflow.
          SOLAR_VERSIONS: "v0.2.8 v0.2.9 v0.2.10 v0.2.11"
        run: |
          $SSH_CMD "APP_PATH='$APP_PATH' VERSIONS='$SOLAR_VERSIONS' bash -s" << 'INSTALL_SCRIPT'
          set -euo pipefail
          mkdir -p "$APP_PATH/solar"
          cd "$APP_PATH/solar"
          for v in $VERSIONS; do
            target="$APP_PATH/solar/$v"
            mkdir -p "$target"
            if [ -f "$target/.installed" ]; then
              echo "→ Solar $v already installed, skipping"
              continue
            fi
            tmp=$(mktemp -d)
            # Solar is a PUBLIC repo: pull the release tarball anonymously over
            # HTTPS (asset name matches Solar's release.yml: solar-<tag>.tgz).
            # -f fails on HTTP >=400 so a partial download leaves the dir
            # unmarked and the next deploy retries.
            curl -fsSL --retry 3 -o "$tmp/solar-$v.tgz" \
              "https://github.com/ZabLaboratory/Solar/releases/download/$v/solar-$v.tgz"
            tar -xzf "$tmp/solar-$v.tgz" -C "$target"
            rm -rf "$tmp"
            touch "$target/.installed"
            echo "✓ installed Solar $v at $target"
            ls -la "$target/" | head -10
          done
          echo "=== Final layout ==="
          find "$APP_PATH/solar" -maxdepth 2 -type d
          INSTALL_SCRIPT

      - name: Write remote .env
        env:
          SSH_CMD: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}
          APP_PATH: ${{ secrets.VPS_APP_PATH }}
          ORION_PG_PASSWORD: ${{ secrets.ORION_PG_PASSWORD }}
          ORION_SERVICE_REFRESH_TOKEN: ${{ secrets.ORION_SERVICE_REFRESH_TOKEN }}
          ORION_ENCRYPTION_KEY: ${{ secrets.ORION_ENCRYPTION_KEY }}
          ORION_LSDP_MODE: ${{ vars.ORION_LSDP_MODE }}
          ORION_SERVICE_PATHS: ${{ vars.ORION_SERVICE_PATHS }}
          ORION_DATASOURCES: ${{ vars.ORION_DATASOURCES }}
          ORION_ZABGATE_URL: ${{ vars.ORION_ZABGATE_URL }}
        run: |
          $SSH_CMD "cat > $APP_PATH/.env && chmod 600 $APP_PATH/.env" << EOF
          # Public surface
          ORION_LISTEN_ADDR=0.0.0.0:4007
          ORION_INTERNAL_ADDR=0.0.0.0:4017
          ORION_PUBLIC_BASE_URL=https://zabgate.cyell.dev/orion

          # Database — orion-postgres on zab-internal
          ORION_DATABASE_URL=postgres://orion:$ORION_PG_PASSWORD@orion-postgres:5432/orion?sslmode=disable
          ORION_PG_USER=orion
          ORION_PG_PASSWORD=$ORION_PG_PASSWORD
          ORION_PG_DB=orion

          # Filesystem roots
          ORION_ASSET_ROOT=/var/lib/orion/assets
          ORION_SOLAR_ROOT=/var/lib/orion/solar

          # Auth — Orion validates show-tokens against ZabAuth via the gateway.
          ORION_ZABAUTH_VALIDATE_URL=http://zabgate:4000/auth/api/v1/tokens
          ORION_AUTH_CACHE_TTL_S=60

          # No standing credential on the antenne .env (ADR ZabAuth 003 Am.3
          # § A3.3 parts 5/6, RC 47): ORION_SERVICE_TOKEN is dev/test-only and
          # refused by the antenne profile, ORION_OPERATOR_TOKEN is retired with
          # its last consumer (EgressTokenSource). The durable refresh family
          # below is the only credential path.
          ORION_SERVICE_PATHS=${ORION_SERVICE_PATHS:-quasar.credentials.read}

          # Durable service token (ADR ZabAuth 003 Am.3 § A3.3 parts 1/2/5).
          # The seed is an amorce consumed by the FIRST rotation; the deploy
          # path must stop re-injecting it once the family is established, and
          # the secret is purged at étage 1 (§ 5 R8, § A3.7 step 2.6). Replaying
          # a consumed generation trips reuse and revokes the live family.
          ORION_SERVICE_REFRESH_TOKEN=$ORION_SERVICE_REFRESH_TOKEN
          ORION_ENCRYPTION_KEY=$ORION_ENCRYPTION_KEY

          # db.query topology A — empty unless the repo variables are set.
          ORION_DATASOURCES=${ORION_DATASOURCES:-}
          ORION_ZABGATE_URL=${ORION_ZABGATE_URL:-}

          # Upstream services (compile-time fetch through the gateway)
          ORION_CANVAS_BASE_URL=http://zabgate:4000/canvas
          ORION_BLUE_BASE_URL=http://zabgate:4000/blue
          ORION_QUASAR_BASE_URL=http://zabgate:4000/quasar

          # Runtime
          ORION_TICK_HZ=60
          ORION_PUSH_TIMEOUT_S=10
          ORION_HTTP_POLL_USER_AGENT=orion-poller/1.0
          ORION_LOG_LEVEL=info
          ORION_LOG_FORMAT=json

          # Empty (bespoke) unless the ORION_LSDP_MODE repo variable is set.
          ORION_LSDP_MODE=${ORION_LSDP_MODE:-bespoke}
          EOF

      - name: Build, migrate, restart
        env:
          SSH_CMD: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}
          APP_PATH: ${{ secrets.VPS_APP_PATH }}
          GIT_REVISION: ${{ github.sha }}
          GIT_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          BLUE_READ_TOKEN: ${{ steps.blue-read-app-token.outputs.token }}
        run: |
          $SSH_CMD "APP_PATH='$APP_PATH' ORION_GIT_REVISION='$GIT_REVISION' ORION_GIT_SOURCE='$GIT_SOURCE' BLUE_READ_TOKEN='$BLUE_READ_TOKEN' bash -s" << 'DEPLOY_SCRIPT'
          set -euo pipefail
          export ORION_GIT_REVISION ORION_GIT_SOURCE BLUE_READ_TOKEN
          cd "$APP_PATH"

          echo "=== Network preflight ==="
          for net in caddy-public zab-internal; do
            if ! docker network inspect "$net" >/dev/null 2>&1; then
              echo "  Creating missing network: $net"
              docker network create "$net"
            else
              echo "  Network present: $net"
            fi
          done

          echo "=== Build ==="
          docker compose -f docker-compose.prod.yml build --quiet
          unset BLUE_READ_TOKEN

          echo "=== Ensure DB is up ==="
          docker compose -f docker-compose.prod.yml up -d orion-db
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yml ps orion-db | grep -q healthy; then break; fi
            sleep 2
          done

          # Migrate (goose) — RETIRED (#15, #331, ADR-BLUE-012 §4.3, Bastion
          # C3): Orion holds no database and no /migrations/goose binary in
          # the image anymore.

          # ONE boot per deploy. `up -d` followed by `up -d --force-recreate
          # orion` started Orion twice: the first instance took the rotation
          # advisory lock, rotated the durable service-token family (ZabAuth
          # advanced to generation N+1) and was destroyed ~1 s later by the
          # recreate — inside the exact window the persist-before-swap marker
          # brackets. The successor only ever existed in the dead container's
          # memory, so the next boot found the marker, refused to replay a
          # consumed generation (correctly) and aired with NO service token.
          # Observed 2026-08-08 on the #307 cutover; runbook
          # docs/runbooks/service-token-cutover-2026-08-08.md.
          echo "=== Up services (single boot) ==="
          docker compose -f docker-compose.prod.yml up -d orion-db
          docker compose -f docker-compose.prod.yml up -d --force-recreate orion

          echo "=== Health (internal) ==="
          sleep 5
          HEALTHY=0
          for i in $(seq 1 15); do
            if docker run --rm --network zab-internal curlimages/curl:latest -sf http://orion:4007/api/v1/health > /dev/null 2>&1; then
              HEALTHY=1; break
            fi
            echo "  Waiting... ($i/15)"; sleep 3
          done
          if [ $HEALTHY -eq 0 ]; then
            echo "::error::Internal health check failed"
            docker compose -f docker-compose.prod.yml logs --tail=50 orion
            exit 1
          fi
          echo "Orion healthy"
          DEPLOY_SCRIPT

      - name: Smoke test via gateway
        env:
          SSH_CMD: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}
          APP_PATH: ${{ secrets.VPS_APP_PATH }}
        run: |
          # Gateway-first: validate the full Caddy + DNS + TLS path. Bounded
          # retry/backoff absorbs the upstream re-resolve lag after
          # --force-recreate; a persistent failure still fails the deploy.
          ATTEMPTS=8
          ok=0
          for i in $(seq 1 $ATTEMPTS); do
            if $SSH_CMD 'curl -fsS --max-time 5 https://zabgate.cyell.dev/orion/api/v1/health > /dev/null'; then
              ok=1
              echo "Gateway probe OK on attempt $i/$ATTEMPTS"
              break
            fi
            echo "Gateway probe attempt $i/$ATTEMPTS not ready; backing off..."
            sleep $((i + i / 2 + 1))
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Public gateway probe failed after $ATTEMPTS attempts (Caddy/DNS/TLS or routing)"
            $SSH_CMD "docker compose -f '$APP_PATH'/docker-compose.prod.yml logs --tail=50 orion"
            exit 1
          fi
          echo "Orion reachable via https://zabgate.cyell.dev/orion/*"
