services:
  orion:
    build: .
    container_name: orion-api
    restart: unless-stopped
    ports:
      - "4007:4007"
    env_file: ../.env.orion
    depends_on:
      orion-db:
        condition: service_healthy
    networks:
      zab_network:
        aliases:
          - orion
          - orion-api

  orion-db:
    image: postgres:16-alpine
    container_name: orion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orion_dev}
      POSTGRES_DB: ${POSTGRES_DB:-orion}
    ports:
      - "5447:5432"
    volumes:
      - orion_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      zab_network:
        aliases:
          - orion-postgres

volumes:
  orion_pg_data:
    name: orion_pg_data

networks:
  zab_network:
    name: zab_network
    external: true
